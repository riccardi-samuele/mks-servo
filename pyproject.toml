[project]
name = "mks-servo"
version = "1.0.0"
description = "Python library for MKS SERVO42D RS485 stepper drivers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Samuele Riccardi", email = "sammyriccardi@gmail.com" }]
keywords = ["mks", "servo42d", "stepper", "rs485", "robotics", "motor", "nema17"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Typing :: Typed",
]
dependencies = [
    "pyserial>=3.5",
    "ruamel.yaml>=0.18",
    "click>=8.1",
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.7", "numpy>=1.24"]
dev   = ["pytest>=7.4", "pytest-mock>=3.11"]

[project.scripts]
mks-servo = "mks_servo.cli.__main__:main"

[tool.pytest.ini_options]
markers = [
    "hil: requires real hardware (skipped by default)",
]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mks_servo*"]

[tool.setuptools.package-data]
mks_servo = ["profiles/_templates/*.yaml"]
