[project]
name = "mks-servo"
version = "0.1.0"
description = "Python library for MKS SERVO42D RS485 stepper drivers"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "ruamel.yaml>=0.18",
    "click>=8.1",
    "tomli>=2.0;python_version<'3.11'",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.7", "numpy>=1.24"]
dev   = ["pytest>=7.4", "pytest-mock>=3.11"]

[project.scripts]
mks-servo = "mks_servo.cli.__main__:main"

[tool.pytest.ini_options]
markers = [
    "hil: requires real hardware (skipped by default)",
]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mks_servo*"]

[tool.setuptools.package-data]
mks_servo = ["profiles/_templates/*.yaml"]
